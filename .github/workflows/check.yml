name: Check repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild synthetic examples
        run: node scripts/build-examples.mjs
      - name: Check generated page is current
        run: git diff --exit-code -- examples/index.html
      - name: Validate guidance, examples, links and capture hashes
        run: node --test tests/repository.test.mjs
